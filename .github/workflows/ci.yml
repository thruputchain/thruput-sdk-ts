name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Static checks are runtime-independent, so they run once on the version we
  # develop against (keep in sync with .nvmrc). Only `test` needs the matrix.
  # Everything here installs anonymously from public npm and needs no secrets,
  # so it runs for pull requests from forks too.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run format:check
      - run: npm run docs:check
      - run: npm run rpc:check
      - run: npm run test:integration-config
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:package-boundary

  # We publish a library, so the runtime is the consumer's choice, not ours.
  # Test the edges of the supported range: Active LTS and Current (which
  # catches deprecations before consumers hit them). Note that `22` here
  # resolves to the latest 22.x, NOT the declared floor — see the `floor` job.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run test

      # vitest transforms src/, so it can pass on a runtime that cannot load
      # what we actually ship. Build and load dist/ to check the artifact.
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run test:package-boundary

  # A major-only selector resolves to the newest release of that line, so the
  # matrix above cannot catch a feature that landed mid-major: a consumer on
  # the floor we advertise in engines.node would break while CI stayed green.
  # This is not hypothetical — it caught our .cjs entry points failing below
  # 22.12.0, where require() of an ES module is still flagged and @noble/hashes
  # reaches us through @thruputchain/protocol's CJS build.
  #
  # The floor cannot build itself (tsdown requires ^22.18.0 || >=24), so build
  # on the dev version, then swap the runtime down to the exact floor and
  # reinstall without devDependencies. That is also the shape a consumer
  # actually gets: our published artifact, our production deps, nothing else.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Switch to the declared engines.node floor
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0

      - run: npm ci --omit=dev

      - run: node --version
      - run: npm run test:smoke

  # Node 27 (October 2026) collapses the odd/even split — every major becomes
  # LTS — and adds a six-month alpha channel specifically so library authors
  # can find breakage before their consumers do. Non-blocking, and main-only:
  # an upstream nightly that is broken on arrival must not red-X the branch.
  test-nightly:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 27-nightly

      - run: npm ci

      - run: npm run test
      - run: npm run build
      - run: npm run test:smoke

  # The jobs below build the `thruput` CLI release pinned in
  # scripts/integration-versions.json from crates.io. Building it takes a
  # while, which is why the fast static checks above run in their own job.
  contracts:
    name: Generated contract bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Set up integration CLI
        uses: ./.github/actions/setup-integration-cli
        with:
          app-id: ${{ vars.COMPONENT_READER_APP_ID }}
          private-key: ${{ secrets.COMPONENT_READER_PRIVATE_KEY }}

      - run: npm ci

      - run: npm run contracts:check

  # The devnode needs the Ubuntu 26.04 runtime libraries that only the
  # project's Namespace runner profile provides. Self-hosted runners must not
  # execute code from forks, so this job runs for pushes to main and for pull
  # requests from branches in this repository; a maintainer runs it for fork
  # contributions by pushing the change to a branch here.
  integration:
    name: Live node integration
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: namespace-profile-hogd-linux-2604
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Set up integration CLI
        uses: ./.github/actions/setup-integration-cli
        with:
          app-id: ${{ vars.COMPONENT_READER_APP_ID }}
          private-key: ${{ secrets.COMPONENT_READER_PRIVATE_KEY }}

      - run: npm ci

      - run: npm run test:integration
        env:
          THRUPUT_INTEGRATION_LOG_DIR: ${{ runner.temp }}/integration-logs
      - run: npm run test:integration:blocks
        env:
          THRUPUT_INTEGRATION_LOG_DIR: ${{ runner.temp }}/integration-logs/blocks

      - name: Upload node diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-node-logs
          path: ${{ runner.temp }}/integration-logs
          if-no-files-found: ignore
          retention-days: 7

  cross-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master as of 2026-06
        with:
          toolchain: stable

      - run: npm ci

      - name: Generate golden test vectors
        run: ./scripts/regen-test-vectors.sh

      - name: Run golden vector tests
        run: npx vitest run src/derivation src/signedOp src/transaction/pubkeyAuthGolden.test.ts
