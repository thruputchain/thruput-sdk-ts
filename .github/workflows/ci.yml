name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  # Static checks are runtime-independent, so they run once on the version we
  # develop against (keep in sync with .nvmrc). Only `test` needs the matrix.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@groundhogchain"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run format:check
      - run: npm run docs:check
      - run: npm run typecheck
      - run: npm run build

  # We publish a library, so the runtime is the consumer's choice, not ours.
  # Test the edges of the supported range: the floor declared in engines.node
  # (catches use of an API newer than we advertise), Active LTS, and Current
  # (catches deprecations before consumers hit them).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@groundhogchain"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run test

      # vitest transforms src/, so it can pass on a runtime that cannot load
      # what we actually ship. Build and load dist/ to check the artifact.
      - run: npm run build
      - run: npm run test:smoke

  # Node 27 (October 2026) collapses the odd/even split — every major becomes
  # LTS — and adds a six-month alpha channel specifically so library authors
  # can find breakage before their consumers do. Non-blocking, and main-only:
  # an upstream nightly that is broken on arrival must not red-X the branch.
  test-nightly:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 27-nightly
          registry-url: https://npm.pkg.github.com
          scope: "@groundhogchain"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run test
      - run: npm run build
      - run: npm run test:smoke

  cross-sdk:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRIES_GROUNDHOG_INDEX: "sparse+https://groundhog.dev/crates/api/v1/crates/"
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@groundhogchain"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master as of 2026-06
        with:
          toolchain: stable

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate golden test vectors
        run: ./scripts/regen-test-vectors.sh

      - name: Run golden vector tests
        run: npx vitest run src/derivation
