name: Bug report
description: Something in @thruputchain/client does not behave as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `npm ls @thruputchain/client`
      placeholder: "0.25.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node.js version, browser, or bundler, plus operating system
      placeholder: "Node 24.3.0 on macOS 15"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Include error messages verbatim.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code sample that reproduces the problem. Never include private keys or seeds.
      render: ts
  - type: input
    id: network
    attributes:
      label: Network and RPC endpoint
      description: For example Futurenet, a local `thruput node`, or a custom endpoint, with the node or CLI version if known.
