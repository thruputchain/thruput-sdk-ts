name: Release package

on:
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
      packages: write
    runs-on: namespace-profile-hogd-linux-2604
    env:
      CARGO_REGISTRIES_THRUPUT_INDEX: "sparse+https://crates.thruput.network/api/v1/crates/"
      CARGO_REGISTRIES_THRUPUT_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@thruputchain"

      - name: Set up integration CLI
        uses: ./.github/actions/setup-integration-cli
        with:
          app-id: ${{ vars.COMPONENT_READER_APP_ID }}
          private-key: ${{ secrets.COMPONENT_READER_PRIVATE_KEY }}

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "All packages at version $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Same gate as CI's `check` job — a release is dispatched manually and
      # can run on a commit CI never covered, so it re-verifies rather than
      # trusting a green tick upstream.
      - run: npm run format:check
      - run: npm run docs:check
      - run: npm run contracts:check
      - run: npm run rpc:check
      - run: npm run test:integration-config
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run test:package-boundary

      - run: npm run test:integration
        env:
          THRUPUT_INTEGRATION_LOG_DIR: ${{ runner.temp }}/integration-logs
      - run: npm run test:integration:blocks
        env:
          THRUPUT_INTEGRATION_LOG_DIR: ${{ runner.temp }}/integration-logs/blocks

      - name: Upload node diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-integration-logs
          path: ${{ runner.temp }}/integration-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Tag commit with version
        id: tag
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists!"
            exit 1
          fi
          git tag "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Push tag
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          git remote set-url origin https://${{ github.actor }}:${{ github.token }}@github.com/${{ github.repository }}.git
          REMOTE_TAG_REF=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$REMOTE_TAG_REF" ]; then
            LOCAL_COMMIT=$(git rev-parse "$TAG")
            if [ "$REMOTE_TAG_REF" = "$LOCAL_COMMIT" ]; then
              echo "Tag $TAG already exists on remote at same commit. Skipping push."
            else
              echo "ERROR: Tag $TAG exists on remote but points to different commit!"
              exit 1
            fi
          else
            git push origin "$TAG"
          fi

      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
