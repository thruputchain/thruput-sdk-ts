name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  # Static checks are runtime-independent, so they run once on the version we
  # develop against (keep in sync with .nvmrc). Only `test` needs the matrix.
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRIES_GROUNDHOG_INDEX: "sparse+https://crates.thruput.network/api/v1/crates/"
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
      GROUNDHOG_CLI_VERSION: "0.19.0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@groundhogchain"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master as of 2026-06
        with:
          toolchain: stable

      - name: Cache contract binding generator
        id: groundhog-cli-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/groundhog
          key: groundhog-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.GROUNDHOG_CLI_VERSION }}

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install contract binding generator
        if: steps.groundhog-cli-cache.outputs.cache-hit != 'true'
        run: cargo install "groundhog-cli@${GROUNDHOG_CLI_VERSION}" --registry groundhog --locked

      - name: Configure contract binding generator
        run: |
          echo "GROUNDHOG_CLI=$(command -v groundhog)" >> "$GITHUB_ENV"

      - run: npm run format:check
      - run: npm run docs:check
      - run: npm run contracts:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:package-boundary

  # We publish a library, so the runtime is the consumer's choice, not ours.
  # Test the edges of the supported range: Active LTS and Current (which
  # catches deprecations before consumers hit them). Note that `22` here
  # resolves to the latest 22.x, NOT the declared floor — see the `floor` job.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@groundhogchain"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run test

      # vitest transforms src/, so it can pass on a runtime that cannot load
      # what we actually ship. Build and load dist/ to check the artifact.
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run test:package-boundary

  # A major-only selector resolves to the newest release of that line, so the
  # matrix above cannot catch a feature that landed mid-major: a consumer on
  # the floor we advertise in engines.node would break while CI stayed green.
  # This is not hypothetical — it caught our .cjs entry points failing below
  # 22.12.0, where require() of an ES module is still flagged and @noble/hashes
  # reaches us through @groundhogchain/protocol's CJS build.
  #
  # The floor cannot build itself (tsdown requires ^22.18.0 || >=24), so build
  # on the dev version, then swap the runtime down to the exact floor and
  # reinstall without devDependencies. That is also the shape a consumer
  # actually gets: our published artifact, our production deps, nothing else.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@groundhogchain"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - name: Switch to the declared engines.node floor
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          registry-url: https://npm.pkg.github.com
          scope: "@groundhogchain"

      - run: npm ci --omit=dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: node --version
      - run: npm run test:smoke

  # Node 27 (October 2026) collapses the odd/even split — every major becomes
  # LTS — and adds a six-month alpha channel specifically so library authors
  # can find breakage before their consumers do. Non-blocking, and main-only:
  # an upstream nightly that is broken on arrival must not red-X the branch.
  test-nightly:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 27-nightly
          registry-url: https://npm.pkg.github.com
          scope: "@groundhogchain"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run test
      - run: npm run build
      - run: npm run test:smoke

  integration:
    name: Live node integration
    runs-on: namespace-profile-hogd-linux-2604
    timeout-minutes: 15
    env:
      CARGO_REGISTRIES_GROUNDHOG_INDEX: "sparse+https://crates.thruput.network/api/v1/crates/"
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@groundhogchain"

      - name: Read integration toolchain pin
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import versions from "./scripts/integration-versions.json" with { type: "json" };
            appendFileSync(process.env.GITHUB_ENV, `GROUNDHOG_CLI_VERSION=${versions.cli}\n`);
          '

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master as of 2026-06
        with:
          toolchain: stable

      - name: Cache CLI
        id: groundhog-cli-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/groundhog
          key: groundhog-cli-${{ runner.os }}-${{ runner.arch }}-namespace-hogd-linux-2604-${{ env.GROUNDHOG_CLI_VERSION }}

      - name: Install CLI
        if: steps.groundhog-cli-cache.outputs.cache-hit != 'true'
        run: cargo install "groundhog-cli@${GROUNDHOG_CLI_VERSION}" --registry groundhog --locked

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run test:integration
        env:
          GROUNDHOG_INTEGRATION_LOG_DIR: ${{ runner.temp }}/integration-logs

      - name: Upload node diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-node-logs
          path: ${{ runner.temp }}/integration-logs
          if-no-files-found: ignore
          retention-days: 7

  cross-sdk:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRIES_GROUNDHOG_INDEX: "sparse+https://crates.thruput.network/api/v1/crates/"
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@groundhogchain"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master as of 2026-06
        with:
          toolchain: stable

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate golden test vectors
        run: ./scripts/regen-test-vectors.sh

      - name: Run golden vector tests
        run: npx vitest run src/derivation src/signedOp
