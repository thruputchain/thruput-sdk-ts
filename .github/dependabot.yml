version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # @thruputchain/* versions are pinned to a qualified protocol release and
    # bumped deliberately alongside the live-node qualification pins.
    ignore:
      - dependency-name: "@thruputchain/*"
      # TypeDoc 0.28 supports TypeScript up to 6.0, so a TypeScript 7 update
      # cannot install. Remove this once TypeDoc supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
