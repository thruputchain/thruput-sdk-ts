name: Release package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and preview publication without publishing or tagging
        type: boolean
        default: true

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: read
    runs-on: namespace-profile-hogd-linux-2604
    env:
      CARGO_REGISTRIES_THRUPUT_INDEX: "sparse+https://crates.thruput.network/api/v1/crates/"
      CARGO_REGISTRIES_THRUPUT_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@thruputchain"

      - name: Set up integration CLI
        uses: ./.github/actions/setup-integration-cli
        with:
          app-id: ${{ vars.COMPONENT_READER_APP_ID }}
          private-key: ${{ secrets.COMPONENT_READER_PRIVATE_KEY }}

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "All packages at version $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Same gate as CI's `check` job — a release is dispatched manually and
      # can run on a commit CI never covered, so it re-verifies rather than
      # trusting a green tick upstream.
      - run: npm run format:check
      - run: npm run docs:check
      - run: npm run contracts:check
      - run: npm run rpc:check
      - run: npm run test:integration-config
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run test:package-boundary

      - run: npm run test:integration
        env:
          THRUPUT_INTEGRATION_LOG_DIR: ${{ runner.temp }}/integration-logs
      - run: npm run test:integration:blocks
        env:
          THRUPUT_INTEGRATION_LOG_DIR: ${{ runner.temp }}/integration-logs/blocks

      - name: Upload node diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-integration-logs
          path: ${{ runner.temp }}/integration-logs
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@thruputchain"

      - name: Publish package to npm
        run: bash scripts/publish-npm.sh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
